spring.application.name=ebookstore

# ---------------------------------------------------------------------------
# Active profile: "local" loads application-local.properties (GITIGNORED) where
# private secrets live. Fresh clones run fine without it - the safe defaults
# below are used. In production, set env vars (DB_PASSWORD, JWT_SECRET, ...)
# or SPRING_PROFILES_ACTIVE to a hardened profile instead.
# ---------------------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL (safe fallbacks; override via env vars or application-local.properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ebookstore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase (database schema auto-created on first run)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT - DEV DEFAULT ONLY, always override via the JWT_SECRET env var in production.
# Must be a Base64-encoded key of at least 32 bytes (256 bits) for HS256.
jwt.secret=${JWT_SECRET:ZGV2T25seUp3dFNlY3JldEtleS1DaGFuZ2UtTWUtSW4tUHJvZHVjdGlvbiE=}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# File Upload
file.upload-dir=${FILE_UPLOAD_DIR:uploads/}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}

# Object storage for photos: "false" = local disk (file.upload-dir, served at
# /uploads/**), "true" = S3-compatible bucket (Neon Storage, AWS S3, R2, MinIO).
# Secrets belong in the gitignored application-local.properties or env vars.
storage.s3.enabled=${S3_ENABLED:false}
storage.s3.endpoint=${AWS_ENDPOINT_URL_S3:}
storage.s3.region=${AWS_REGION:us-east-2}
storage.s3.bucket=${S3_BUCKET:}
storage.s3.access-key=${AWS_ACCESS_KEY_ID:}
storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Server
server.port=${SERVER_PORT:8080}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
